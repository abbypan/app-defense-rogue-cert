plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'com.cert.aspin'
    compileSdk 36



    defaultConfig {
        applicationId "com.cert.aspin"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "BENCHMARK_MODE", '"primary"'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            storeFile file("../../../signing/es256/my-app-key.keystore")
            storePassword "123456"
            keyAlias "my_app"
            keyPassword "123456"
        }
        release {
            storeFile file("../../../signing/es256/my-app-key.keystore")
            storePassword "123456"
            keyAlias "my_app"
            keyPassword "123456"
        }
        crossAppCaller {
            // Deliberately differs from the es256 target app's signing key. A successful
            // A -> B smoke test therefore proves that the OS resolved App B's key.
            storeFile file("../../../signing/es384/my-app-key.keystore")
            storePassword "123456"
            keyAlias "my_app"
            keyPassword "123456"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        crossAppCaller {
            initWith debug
            applicationIdSuffix ".caller"
            signingConfig signingConfigs.crossAppCaller
            matchingFallbacks = ['debug']
        }
        scpBenchmark {
            initWith debug
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
            buildConfigField "String", "BENCHMARK_MODE", '"scp"'
        }
        compatibilityBenchmark {
            initWith debug
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
            buildConfigField "String", "BENCHMARK_MODE", '"compatible"'
            manifestPlaceholders = [
                    aspinPolicyPublicKey: file(providers.gradleProperty("aspinPolicyPublicKeyFile")
                            .getOrElse("../../../signing/es256/my-dcp-pub.txt"))
                            .getText("UTF-8").trim()
            ]
        }
        crossAppHidden {
            initWith crossAppCaller
            applicationIdSuffix ".hidden"
            matchingFallbacks = ['debug']
        }
        publicCrossPrimary {
            initWith debug
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
        publicCrossCompatible {
            initWith compatibilityBenchmark
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
        dcpBenchmark {
            initWith debug
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
            buildConfigField "String", "BENCHMARK_MODE", '"dcp"'
            manifestPlaceholders = [
                    dcpPolicyPublicKey: file("../../../signing/es256/my-dcp-pub.txt")
                            .getText("UTF-8").trim()
            ]
        }
    }

    sourceSets {
        main.java.srcDir "../../shared/src/main/java"
        main.res.srcDir "../../shared/src/main/res"
        test.java.srcDir "../../shared/src/test/java"
        if (providers.gradleProperty("aspinScpResourceDir").isPresent()) {
            scpBenchmark.res.setSrcDirs([providers.gradleProperty("aspinScpResourceDir").get()])
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    
    // Configure Java toolchain to use Java 22
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation 'com.google.guava:guava:32.1.3-jre'
    implementation libs.json
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
