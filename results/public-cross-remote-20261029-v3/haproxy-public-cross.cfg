global
    maxconn 1024
defaults
    mode tcp
    timeout connect 10s
    timeout client 5m
    timeout server 5m
frontend shared_tls
    bind 0.0.0.0:443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    use_backend aspin_origin if { req_ssl_sni -i dcp.idouzi.top es256.idouzi.top es384.idouzi.top rsa3072.idouzi.top rsa4096.idouzi.top }
    use_backend aspin_public_cross if { req_ssl_sni -i cross.idouzi.top }
    default_backend previous_tls
backend aspin_origin
    server origin 127.0.0.1:8443
backend previous_tls
    server original 127.0.0.1:10443

backend aspin_public_cross
    server public_cross 127.0.0.1:18443
